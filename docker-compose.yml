# Local infrastructure only. The API and web app run natively for fast reloads.
# Ports are offset (5433 / 6380) so they don't collide with Homebrew Postgres/Redis.
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: noted
      POSTGRES_PASSWORD: noted
      POSTGRES_DB: noted
    ports:
      - "5433:5432"
    volumes:
      - noted_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U noted -d noted"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6380:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  noted_pgdata:
